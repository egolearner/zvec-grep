name: Build macOS ARM Rust packages

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  source:
    name: Validate package source
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate the manifest and package version
        id: version
        working-directory: rust
        run: |
          rustup show active-toolchain
          npm run release:verify
          version="$(cargo metadata --locked --no-deps --format-version 1 | node -e 'let s=""; process.stdin.on("data", d => s+=d).on("end", () => console.log(JSON.parse(s).packages.find(p => p.name === "zg").version))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test package selection and installation
        working-directory: rust
        run: node --test scripts/npm-*.test.mjs npm/meta/install.test.cjs

  build:
    name: Build darwin-arm64
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/rust-package-build.yml
    with:
      target: darwin-arm64
      runner: macos-14

  collect:
    name: Collect downloadable macOS ARM packages
    needs: [source, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: rust-native-darwin-arm64
          path: rust/dist/npm/release/tarballs
      - name: Pack the exact-version meta package
        run: |
          rustup show active-toolchain
          npm run release:meta
      - name: Checksum the macOS ARM tarballs
        working-directory: rust/dist/npm/release/tarballs
        run: sha256sum *.tgz > SHA256SUMS
      - name: Upload macOS ARM packages
        uses: actions/upload-artifact@v7
        with:
          name: rust-candidate-${{ needs.source.outputs.version }}-darwin-arm64
          path: rust/dist/npm/release/tarballs/
          if-no-files-found: error
          retention-days: 14
